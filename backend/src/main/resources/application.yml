spring:
  application:
    name: reporta-tu-calle-api
  
  # --- SOLUCIÓN AL ERROR DE FLYWAY ---
  flyway:
    baseline-on-migrate: true
  
  datasource:
    url: jdbc:postgresql://localhost:5432/reporta_tu_calle
    username: ${DB_USERNAME:admin}
    password: ${DB_PASSWORD:admin_password}
    driver-class-name: org.postgresql.Driver
  
  jpa:
    hibernate:
      ddl-auto: validate
    #para produccion seria false
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: 8080
  servlet:
    context-path: /

logging:
  level:
    root: INFO
    com.reportatucalle: DEBUG

storage:
  provider: local

app:
  base-url: ${APP_BASE_URL:http://localhost:8080}
  security:
    jwt:
      secret: ${JWT_SECRET:estaEsUnaClaveSecretaMuyLargaParaPoderFirmarLosTokensDeNuestraApp}
      expiration: 86400000