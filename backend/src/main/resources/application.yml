# yaml-language-server: $schema=https://raw.githubusercontent.com/spring-projects/sts4/main/ide/org.springframework.ide.vscode.boot.app.core/resources/application.yml
spring:
  application:
    name: reporta-tu-calle-api
  
  # --- LA SOLUCIÓN AL ERROR DE FLYWAY ---
  flyway:
    baseline-on-migrate: true
  
  datasource:
    url: jdbc:postgresql://localhost:5432/reportatucalle
    username: admin
    password: admin_password
    driver-class-name: org.postgresql.Driver
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: 8080
  servlet:
    context-path: /

logging:
  level:
    root: INFO
    com.reportatucalle: DEBUG

storage:
  provider: local

app:
  base-url: http://localhost:8080/api/v1
  security:
    jwt:
      secret: "estaEsUnaClaveSecretaMuyLargaParaPoderFirmarLosTokensDeNuestraApp"
      expiration: 86400000